<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classificação Linux Rush</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #101214;
        --surface: #171a1e;
        --line: #343a42;
        --muted: #8d96a3;
        --text: #f1f3f5;
        --gold: #f0c36a;
        --silver: #b7c0ca;
        --bronze: #c58b67;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--background);
        color: var(--text);
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 32px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 6vw, 64px);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .total {
        border: 1px solid var(--line);
        padding: 14px 18px;
        min-width: 128px;
        text-align: right;
      }

      .total strong {
        display: block;
        color: var(--text);
        font-size: 28px;
        line-height: 1;
      }

      .total span {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .rankings {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .panel {
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 22px;
        animation: rise 500ms ease both;
      }

      .panel:nth-child(2) { animation-delay: 70ms; }
      .panel:nth-child(3) { animation-delay: 140ms; }
      .panel:nth-child(4) { animation-delay: 210ms; }

      .panel-heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
        margin-bottom: 4px;
      }

      h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .panel-heading span {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .entry {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        align-items: center;
        gap: 12px;
        min-height: 68px;
        border-bottom: 1px solid #292e35;
      }

      .entry:last-child { border-bottom: 0; }

      .position {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 14px;
      }

      .entry:first-of-type .position { color: var(--gold); }
      .entry:nth-of-type(2) .position { color: var(--silver); }
      .entry:nth-of-type(3) .position { color: var(--bronze); }

      .team {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }

      .team-mark {
        width: 9px;
        height: 9px;
        border: 2px solid currentColor;
        display: inline-block;
      }

      .value {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .message {
        grid-column: 1 / -1;
        border: 1px dashed var(--line);
        padding: 48px 20px;
        color: var(--muted);
        text-align: center;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 680px) {
        main { width: min(100% - 28px, 560px); padding-top: 28px; }
        header { align-items: start; flex-direction: column; }
        .total { text-align: left; }
        .rankings { grid-template-columns: 1fr; }
        .panel { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Linux Rush / Classificação ao vivo</p>
          <h1>Classificação</h1>
        </div>
        <div class="total">
          <strong id="total-wins">--</strong>
          <span>Vitórias totais</span>
        </div>
      </header>

      <section id="rankings" class="rankings" aria-live="polite">
        <div class="message">Carregando classificação...</div>
      </section>
    </main>

    <script>
      const teamColors = new Map();
      const availableColors = [
        "#ff4d6d",
        "#00c2a8",
        "#4d8dff",
        "#ff9f1c",
        "#b56bff",
        "#a8d500",
      ];

      const colorForTeam = team => {
        if (!teamColors.has(team)) {
          const colorIndex = Math.floor(Math.random() * availableColors.length);
          const [color] = availableColors.splice(colorIndex, 1);
          teamColors.set(team, color);
        }
        return teamColors.get(team);
      };

      const formatValue = (type, item) => {
        if (type === "completion") return `${Math.round(item.completion)}%`;
        return item.timestamp ? new Date(item.timestamp).toLocaleString("pt-BR", {
          day: "numeric",
          month: "short",
          hour: "2-digit",
          minute: "2-digit",
        }) : "Sem resultado";
      };

      const renderPanel = ({ title, hint, items, type }) => `
        <article class="panel">
          <div class="panel-heading">
            <h2>${title}</h2>
            <span>${hint}</span>
          </div>
          ${items.map((item, index) => {
            const color = colorForTeam(item.team);
            return `
              <div class="entry">
                <span class="position">0${index + 1}</span>
                <span class="team" style="color: ${color}">
                  <i class="team-mark" aria-hidden="true"></i>${item.team}
                </span>
                <span class="value">${formatValue(type, item)}</span>
              </div>`;
          }).join("")}
        </article>`;

      const render = data => {
        document.querySelector("#total-wins").textContent = data.totalWins ?? 0;
        document.querySelector("#rankings").innerHTML = [
          renderPanel({ title: "Velocidade", hint: "primeira flag", items: data.teamSpeedRank || [], type: "speed" }),
          renderPanel({ title: "Conclusão", hint: "taxa de conclusão", items: data.completionRank || [], type: "completion" }),
        ].join("");
      };

      fetch("http://localhost:3494/leaderboard")
        .then(response => {
          if (!response.ok) throw new Error("Não foi possível carregar a classificação");
          return response.json();
        })
        .then(render)
        .catch(error => {
          document.querySelector("#rankings").innerHTML = `<div class="message">${error.message}</div>`;
        });
    </script>
  </body>
</html>
